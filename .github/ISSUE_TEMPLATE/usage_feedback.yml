name: 使用反馈
description: 跑完整套流程后的结果、耗时、踩坑与改进建议
title: "[反馈] "
labels: ["feedback"]
body:
  - type: markdown
    attributes:
      value: |
        反馈会用来修正阶段划分、验收门槛和恢复步骤。请勿粘贴订阅地址、令牌、Cookie、验证码或完整 IP。
  - type: dropdown
    id: outcome
    attributes:
      label: 最终结果
      options:
        - 全部必需项通过
        - 部分通过，有未覆盖项
        - 卡住未完成
        - 中途放弃并回退
    validations:
      required: true
  - type: dropdown
    id: path
    attributes:
      label: 采用的路径
      options:
        - Mihomo TUN 固定出口
        - 最小可用路径（系统代理 + CLI 变量）
        - 专用进程代理试用
        - 其他
    validations:
      required: true
  - type: input
    id: env
    attributes:
      label: 环境
      description: macOS 版本、芯片、各工具版本与安装日期
    validations:
      required: true
  - type: textarea
    id: friction
    attributes:
      label: 卡顿或意外的地方
      description: 哪一步最花时间、哪一步文档说得不够、哪里 Agent 做错了
    validations:
      required: true
  - type: textarea
    id: suggestion
    attributes:
      label: 建议改动
      description: 希望文档增加、删除或改写的部分
  - type: checkboxes
    id: redacted
    attributes:
      label: 确认
      options:
        - label: 内容已脱敏，不含订阅地址、令牌、Cookie、验证码或完整 IP
          required: true
