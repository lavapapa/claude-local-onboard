name: 流程卡住或验收不通过
description: 某个阶段无法继续，或探针/检查结果与文档预期不符
title: "[卡住] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        提交前请去掉订阅地址、控制口 Secret、令牌、Cookie、验证码、完整 IP 和账号信息。脱敏后的结论足够定位问题。
  - type: input
    id: stage
    attributes:
      label: 卡住的阶段
      description: 对应 SKILL.md 的阶段编号与标题，例如「阶段 5：安装 Claude Code 并部署 sandbox-exec 受控启动链」
      placeholder: "阶段 6：登录前预验收与受控故障阻断测试"
    validations:
      required: true
  - type: input
    id: env
    attributes:
      label: 环境
      description: macOS 版本、芯片架构（Apple Silicon / Intel）、代理客户端与指纹浏览器版本
      placeholder: "macOS 15.4 / Apple Silicon / FlClash 0.8.x / AdsPower"
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 文档预期
      description: 哪份文档、哪一节、预期看到什么结果
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: 实际现象
      description: 探针输出、报错信息或检查页结论（请脱敏）
      render: shell
    validations:
      required: true
  - type: textarea
    id: tried
    attributes:
      label: 已尝试的处理
      description: 回退步骤、重开会话、换节点等，以及是否改变了结果
  - type: checkboxes
    id: redacted
    attributes:
      label: 确认
      options:
        - label: 内容已脱敏，不含订阅地址、Secret、令牌、Cookie、验证码或完整 IP
          required: true
